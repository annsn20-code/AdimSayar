name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Python kurulumu
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Buildozer ve gerekli sistem kütüphanelerinin doğrudan Ubuntu'ya kurulması
      - name: Install system dependencies and Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade cython virtualenv buildozer

      # 3. Önbellekleme (Derleme hızlandırmak için)
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # 4. Bozuk eklenti yerine Buildozer'i doğrudan terminalden çalıştırıyoruz
      - name: Build with Buildozer
        run: buildozer android debug

      # 5. Oluşan APK'yı GitHub'a yükleme
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Projem-APK
          path: bin/*.apk
          retention-days: 7
