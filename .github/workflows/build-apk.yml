name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Actions sekmesinden manuel tetikleme için

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. İyileştirme: Caching (Önbellekleme). SDK/NDK indirmelerini hafızada tutar.
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # Derleme İşlemi
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: master

      # 2. İyileştirme: APK dosyasını sisteme yükleme ve saklama süresi belirleme
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Projem-APK
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 7 # Oluşan APK'yı GitHub'da 7 gün boyunca saklar
